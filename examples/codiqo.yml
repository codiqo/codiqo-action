# Copy this file to .github/workflows/codiqo.yml in your repository.
#
# Prerequisites:
#   1. A Maven project.
#   2. A secret named CODIQO_API_KEY (get a key at https://codiqo.io): a repository secret, or an
#      organization secret granted to this repository.
name: Codiqo

on:
  # Each push to the default branch is analysed as it lands. Not pull_request: that run checks out
  # GitHub's temporary merge commit, which never lands on a branch, and a fork's gets no secrets.
  push:
    branches: [main]
  # A safety run for anything a push run missed. Give each repository its own minute: many starting
  # at minute 0 queue together on the review's rate limit.
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One analysis at a time. cancel-in-progress: false lets the running one finish and makes the
# newcomer wait, rather than killing an hour of build work or building the same commits twice.
concurrency:
  group: codiqo
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # required: Codiqo skips commits whose parent is missing locally

      - uses: codiqo/codiqo-action@main
        with:
          api-key: ${{ secrets.CODIQO_API_KEY }}
          java-version: '21'   # 21 or newer, and able to build your project
          # One Maven thread per runner core for the per-commit build. Lower it, or remove it to build
          # serially, if a commit dies with exit 137: each concurrently built module may fork a test JVM.
          maven-parallelism: '1C'
