# Codiqo — measure the engineering effort behind your commits.
# Docs: https://github.com/codiqo/codiqo-action
# Setup: add a secret CODIQO_API_KEY (get a key at https://codiqo.io), as a repository secret or an
# organization secret granted to this repository.
name: Codiqo

on:
  push:
    branches: [ $default-branch ]
  # A safety run for anything a push run missed. Change the minute per repository: many starting at
  # minute 0 queue together on the review's rate limit.
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codiqo
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: codiqo/codiqo-action@main
        with:
          api-key: ${{ secrets.CODIQO_API_KEY }}
          java-version: '21'
          maven-parallelism: '1C'
