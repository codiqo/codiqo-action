    CODIQO_IN_DRIVER_FACTOR_MAX_DEVIATION: $[[ inputs.driver-factor-max-deviation ]]
    CODIQO_IN_DRIVER_SCORE_CAP_DRY_RUN: $[[ inputs.driver-score-cap-dry-run ]]
    CODIQO_IN_JDT_USE_SHARED_INDEX: $[[ inputs.jdt-use-shared-index ]]
    CODIQO_IN_JDT_INCLUDE_DECOMPILED_SOURCES: $[[ inputs.jdt-include-decompiled-sources ]]
    CODIQO_IN_JDT_LOMBOK_AGENT: $[[ inputs.jdt-lombok-agent ]]
