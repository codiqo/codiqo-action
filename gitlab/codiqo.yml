# Codiqo for GitLab CI: indexes the project's history, then analyses and submits every commit that still
# lacks an analysis, one at a time, as codiqo/codiqo-action does on GitHub.
#
# GENERATED from action.yml by gitlab/generate.rb. Edit those and regenerate; do not edit this file.
#
#   include:
#     - remote: https://raw.githubusercontent.com/codiqo/codiqo-action/main/gitlab/codiqo.yml
#       inputs:
#         action-ref: main
#
# The API key is a masked CI/CD variable named CODIQO_API_KEY, never an input. Any input below can also be
# set as a CI/CD variable under its job variable name (CODIQO_IN_...), which wins over the input.
spec:
  inputs:
    stage:
      description: "Pipeline stage the codiqo-analyze job runs in."
      default: "test"
    image:
      description: "Job image. It needs a JDK and bash; git, python3, curl, tar and gzip are installed when missing and the job runs as root, and Node.js for the review when it has no npm. Choose the JDK the project builds with: every analysed commit is built with it. The language server, which needs Java 25 or newer, runs on that JDK when it is jdtls-java-version or newer, and otherwise on a Temurin build the job downloads beside it."
      default: "eclipse-temurin:25-jdk"
    job-timeout:
      description: "GitLab timeout of the whole job, which works through every pending commit in turn. It can exceed the project timeout but not the runner's."
      default: "6h"
    action-ref:
      description: "Ref of codiqo/codiqo-action whose scripts the job downloads. Keep it the same as the ref in the include URL."
      default: "main"
    action-archive-url:
      description: "Where the job downloads the action's scripts from, as a .tar.gz with one top directory. Empty uses codiqo/codiqo-action at action-ref on GitHub; set it for a runner that reaches GitHub only through a mirror."
      default: ""
    node-version:
      description: "Node.js release installed, SHA-256 checked, for the npm that installs OpenCode when the image has no npm. Only with review: true."
      default: "24.22.1"
    log-retention-days:
      description: "Days the job keeps its log artifact."
      default: "7"
    api-url:
      description: "Codiqo API base URL. Override only for a self-hosted Codiqo backend."
      default: "https://api.codiqo.io"
    branch:
      description: "Branch name to attribute the commit index to. Left empty the action derives it from the event (the head branch for pull requests), then falls back to letting the plugin auto-detect."
      default: ""
    codiqo-version:
      description: "Version of io.codiqo:codiqo-maven-plugin to run. Codiqo is pre-1.0, so this defaults to a snapshot and the action adds a snapshot repository for it automatically (see manage-plugin-repository)."
      default: "1.0-SNAPSHOT"
    java-home:
      description: "Explicit JDK home for the per-commit build (-Dcodiqo.javaHome), and for the language server when neither jdtls-java-home nor jdtls-java-version gives it one. Left empty they inherit JAVA_HOME and the java on PATH."
      default: ""
    jdtls-java-version:
      description: "Java release the Eclipse JDT language server runs on, beside the JDK that builds the project and without becoming the default JDK: from jdt.ls 1.62.0, the plugin's default, the server needs Java 25 or newer, while the project keeps building on its own JDK. On GitHub it is installed with actions/setup-java, or taken from java-version when the two are equal; on GitLab the image's JDK serves when it is this release or newer, and otherwise Temurin's latest build of it is downloaded (SHA-256 checked) and cached. Either way the plugin gets that JDK's home as -Dcodiqo.jdtlsJavaHome. Ignored when jdtls-java-home is set; an empty string runs the server on the build's JDK, which must then be Java 25 or newer."
      default: "25"
    jdtls-java-home:
      description: "Explicit JDK home for the Eclipse JDT language server alone (-Dcodiqo.jdtlsJavaHome), Java 25 or newer for jdt.ls 1.62.0 and later; it takes precedence over jdtls-java-version."
      default: ""
    build-tool:
      description: "Which build tool drives the analysis: \"maven\" or \"gradle\". Gradle support does not cover the time machine or build-failure capture; see the Gradle section of the README."
      default: "maven"
    gradle-command:
      description: "Gradle executable, or \"auto\" to prefer the project wrapper (./gradlew) over a gradle on PATH. Gradle only."
      default: "auto"
    gradle-tasks:
      description: "Whitespace-separated tasks run before codiqoSubmitAnalysis on each commit, e.g. \"test\" or \":app:test :lib:test\". Empty analyses without running tests, so changed-code coverage stays empty. Gradle only."
      default: "test"
    gradle-project-properties:
      description: "Newline-separated key=value pairs passed as -Pkey=value to every Gradle invocation, the Gradle counterpart of maven-user-properties. Never put secrets here; they would appear on the command line."
      default: ""
    gradle-args:
      description: "Extra Gradle arguments, one per line, the Gradle counterpart of maven-args. A single-line value is split on whitespace for convenience. Gradle only: maven-args is never passed to Gradle, since Maven flags such as -ntp or a -P profile mean something else there."
      default: ""
    analysis-max-heap:
      description: "Heap for the forked Codiqo analysis JVM, e.g. 8g. The Gradle counterpart of an -Xmx in maven-opts; the analysed project's org.gradle.jvmargs does not apply to it. Gradle only."
      default: ""
    maven-command:
      description: "Maven executable. \"auto\" prefers the project's ./mvnw when present and executable, otherwise mvn — the Maven that maven-version installs, or the runner's own when that is empty. Give an explicit path to override."
      default: "auto"
    maven-version:
      description: "Apache Maven release to install from Maven Central and put first on PATH, so a commit is built by the same Maven on every run rather than whatever the runner image ships. The forked per-commit build inherits it unless maven-home names another. A project's ./mvnw still takes precedence under maven-command: auto. Set to an empty string to use the Maven already on PATH. Maven only."
      default: "3.9.16"
    maven-home:
      description: "Maven home for the forked per-commit build (-Dcodiqo.mavenHome)."
      default: ""
    jdtls-version:
      description: "Eclipse JDT language server version (-Dcodiqo.jdtlsVersion). Leave empty to use the version the plugin ships with."
      default: ""
    jdtls-use-snapshot:
      description: "Resolve the language server from Eclipse's snapshot channel instead of a pinned milestone (-Dcodiqo.jdtlsUseSnapshot). jdtls-version is then ignored, and the shared index is re-keyed whenever upstream publishes a new build."
      default: "false"
    commit-window:
      description: "How far back to look for commits needing analysis. Accepts 0 (today only), 1m, 3m, 6m, 1year, or a raw ISO-8601 period such as P2W."
      default: "3m"
    exclude-author-emails:
      description: "Comma-separated author emails to skip entirely; a trailing * is allowed, for example \"bot@*\". Useful for CI and bot accounts."
      default: ""
    include-author-emails:
      description: "Comma-separated author emails to restrict analysis to. Empty means every author except those excluded."
      default: ""
    first-parent-only:
      description: "Follow only the first parent, so a merge is measured as the change it brought to the target branch rather than as its whole side branch."
      default: "true"
    max-commits-per-run:
      description: "Upper bound on commits queued in one run. The real protection against a large backlog on first adoption."
      default: "1024"
    index-batch-size:
      description: "How many commits are sent to the API per index request (-Dcodiqo.indexBatchSize, Maven only). Empty uses the plugin default of 256; the API accepts at most 500."
      default: ""
    index-ref:
      description: "Git ref whose history is walked to find commits needing analysis (-Dcodiqo.indexRef). Empty uses HEAD, which is what a normal branch build wants; set it to index a ref other than the one checked out."
      default: ""
    per-commit-timeout:
      description: "Wall-clock limit for analysing one commit before it is killed, enforced from outside the JVM. This is the outer deadline the build and test budgets are fitted under, so raising or lowering it moves them with it. Empty is the review limit plus 30 minutes with review on (180 by default) and 2h with it off; with review on, a smaller value is raised to that, with a warning."
      default: ""
    build-timeout-minutes:
      description: "Limit for the forked build of a single commit (-Dcodiqo.buildTimeoutMinutes). It has to fire before per-commit-timeout, or the outer deadline kills the analysis before codiqo can record the commit as a build failure. Left empty it is three quarters of per-commit-timeout; a value that would not fit is clamped back to that, with a warning. The default of 90 fits under the default per-commit-timeout with the review on or off."
      default: "90"
    test-timeout-minutes:
      description: "Limit for the test phase of the forked build (-Dcodiqo.testTimeoutMinutes). Clamped to three quarters of the build timeout, so a hung test phase is reaped while the build can still finish and report."
      default: "30"
    per-test-timeout:
      description: "Limit for a single JUnit 5 test method, so one hanging test cannot fail the whole build. Accepts off, 5m, 10m, 15m, or raw minutes; capped at 15 minutes and at half the test-phase budget. JUnit 4 and TestNG are unaffected."
      default: "15m"
    import-timeout-minutes:
      description: "Limit for the language server to import the project (-Dcodiqo.importTimeoutMinutes). Raise it for a very large reactor."
      default: "15"
    api-connect-timeout-seconds:
      description: "Connect timeout for Codiqo API calls."
      default: "30"
    api-read-timeout-seconds:
      description: "Read timeout for Codiqo API calls."
      default: "60"
    maven-user-properties:
      description: "Newline-separated key=value pairs passed as -Dkey=value to every Maven invocation. Do not put secrets here, they would appear on the command line; use settings-xml instead."
      default: ""
    maven-args:
      description: "Extra Maven arguments, one per line. A single-line value is split on whitespace for convenience."
      default: ""
    maven-opts:
      description: "Value for MAVEN_OPTS. It sizes the analysis JVM and the language server; the forked per-commit build inherits it too unless fork-maven-opts is set, so size any -Xmx with several concurrent JVMs in mind. When neither this nor the job's MAVEN_OPTS sets a heap limit, the action adds -XX:MaxRAMPercentage=50, half the runner's memory per JVM. Maven only."
      default: ""
    fork-maven-opts:
      description: "MAVEN_OPTS for the forked per-commit build only (-Dcodiqo.forkMavenOpts). Empty, the fork inherits maven-opts. Set it when the analysis needs a larger heap than the build, and repeat any -D system property the project's own build relies on, since it replaces the inherited value whole. Maven only."
      default: ""
    maven-parallelism:
      description: "Value for Maven -T on the per-commit build, for example 1C. It propagates into the forked build."
      default: ""
    manage-plugin-repository:
      description: "Whether the action may add a repository able to serve the Codiqo plugin: auto (only for a -SNAPSHOT codiqo-version), always, or never."
      default: "auto"
    plugin-repository-url:
      description: "Repository used to resolve the Codiqo plugin and its core extension when the action manages repositories."
      default: "https://central.sonatype.com/repository/maven-snapshots"
    time-machine-repositories:
      description: "Additional id=url lines, one per line, added to the throwaway POM that resolves the time-machine extension. Credentials come from settings-xml, matched by repository id."
      default: ""
    resolve-dependencies:
      description: "Run dependency:go-offline once before analysing, to warm the local repository and surface an unreachable repository as one clear warning; the run continues either way. Off by default because go-offline is imperfect: it misses dependencies reachable only through a plugin, and some reactors make it fail outright."
      default: "false"
    exclude-reverted-commits:
      description: "When a revert is analysed, also retroactively exclude the commit it reverted, so reverted work stops counting."
      default: "true"
    ignore-coverage:
      description: "Skip tests in the forked build. Much faster and useful for a first trial, but produces no coverage data."
      default: "false"
    time-machine:
      description: "Load the Codiqo time-machine core extension into the host Maven, so a historical commit resolves the snapshot dependencies it had at the time rather than the latest ones."
      default: "true"
    dump-analysis:
      description: "Write the submission document the API receives to disk. On its own it lands in a temporary file that dies with the runner; set analysis-output-directory to somewhere you collect if you actually want to read it."
      default: "true"
    analysis-output-directory:
      description: "Directory for the dumped submission document (-Dcodiqo.outputDirectory). Empty leaves it in a runner temporary file. Point it inside the log directory to have it uploaded with the log artifact — one document per commit, so mind the artifact size on a large backlog. Scoring is server-side on this path, so no HTML report is produced locally."
      default: ""
    include-branches:
      description: "Comma-separated regex patterns; only commits on a matching branch are indexed and analysed. Applied while walking history, so a non-matching commit costs no build. Complements exclude-author-emails / include-author-emails."
      default: ""
    skip-on-build-failure:
      description: "Exclude a commit whose build fails instead of failing the run. Turn off only when a build failure should surface as a hard error — a failing or timed-out build then fails the step rather than being recorded as an exclusion."
      default: "true"
    fail-on-uninstrumented-module:
      description: "Fail when a module produced no coverage data, which usually means the coverage agent was not attached. Turn off for reactors where some modules legitimately run no tests."
      default: "true"
    test-failure-hold-share:
      description: "Hold the commit's score out of every figure until someone accepts it in Codiqo when at least this share of executed tests fail: the commit broke what its tests share, or the analysis could not rebuild their environment. The commit is still reviewed and scored. 1 or more turns the check off, for a project whose tests need a database or Docker the CI does not have. Empty keeps the plugin default (0.75)."
      default: ""
    test-failure-hold-min-tests:
      description: "Fewer executed tests than this never hold a score. Empty keeps the plugin default (20)."
      default: ""
    fail-on-jdtls-error:
      description: "Fail when the Java language server reports an error during import. Off by default: an import warning usually degrades blast-radius data rather than invalidating the analysis."
      default: "false"
    ignore-complexity:
      description: "Skip complexity metric collection."
      default: "false"
    ignore-cpd:
      description: "Skip copy-paste detection. Duplication then scores neutral rather than clean — no copy-paste-free bonus is awarded, since nothing was measured."
      default: "false"
    hotspots:
      description: "Rank the most important classes and the hotspots of the commit the run started on, with what can be done about each (uncovered methods, clones, static-analysis findings, complex methods), and submit them for the Codiqo project view and MCP tools. Costs seconds: it reuses the analysis of that commit. Runs only on pushes to the default branch, which owns the project's one snapshot."
      default: "true"
    ignore-diagnostics:
      description: "Skip PMD and SpotBugs collection. Static analysis then scores neutral rather than clean — no clean-code bonus is awarded, since nothing was measured."
      default: "false"
    pmd-rules:
      description: "Comma-separated PMD ruleset resources. REPLACES the default set rather than adding to it, so list every ruleset you still want. Note the default codestyle entry is codiqo's own codiqo/pmd/java-codestyle.xml, not category/java/codestyle.xml: it re-registers MethodNamingConventions so underscore-named test methods are not reported as violations. Swapping in the stock ruleset makes every such test an ERROR-severity finding, which costs quality score."
      default: ""
    pmd-min-priority:
      description: "Lowest PMD rule priority to collect: high, medium_high, medium, medium_low, low (hyphens and spaces are accepted too)."
      default: ""
    spotbugs-priority-threshold:
      description: "Lowest SpotBugs priority to collect, as an integer (1 = high)."
      default: ""
    spotbugs-omit-visitors:
      description: "Comma-separated SpotBugs detectors to skip, for detectors that are slow or noisy on your codebase."
      default: ""
    cpd-minimum-tile-size:
      description: "Minimum token count for a copy-paste clone to be reported."
      default: ""
    cpd-ignore-identifiers:
      description: "Let copy-paste detection match code whose identifiers were renamed. Set to false to report only clones that keep their names."
      default: ""
    diff-context-lines:
      description: "Context lines included around each hunk in the diffs sent for scoring."
      default: ""
    build-error-capture-limit:
      description: "Maximum characters of build output captured into a build-failure report."
      default: ""
    move-detection:
      description: "Detect relocated code so a moved block is charged a small relocation cost instead of full per-line effort."
      default: "true"
    move-similarity-threshold:
      description: "Multiset containment threshold (0-1) above which a deleted and an added line count as the same relocated line."
      default: ""
    moved-line-coefficient:
      description: "Fraction of normal per-line effort charged to a confirmed relocated line."
      default: ""
    driver-score-cap-multiplier:
      description: "Ceiling on a commit's TOTAL raw effort, as a multiple of its summed baseline. Individual block scores are never clipped, so lowering this deflates ordinary large commits rather than trimming one outlier block."
      default: ""
    driver-factor-max-deviation:
      description: "Deviation from the bucket median ratio above which a block is reported as a statement or invocation outlier. This is the per-block measure; driver-score-cap-multiplier bounds the commit total."
      default: ""
    driver-score-cap-dry-run:
      description: "Report where the driver-score cap would apply without actually applying it."
      default: "false"
    jdt-use-shared-index:
      description: "Reuse the shared JDT index across runs. Much faster; turn off to force a clean index."
      default: "true"
    jdt-include-decompiled-sources:
      description: "Let the language server decompile dependency classes without sources. Slower, and rarely changes blast radius."
      default: "false"
    jdt-lombok-agent:
      description: "Attach lombok to the language server so call hierarchy resolves the members lombok generates. Turn off for a project that does not use lombok: the agent also widens every caller lookup, which costs time and can reach a JDT failure."
      default: "true"
    jdt-source-exclusions:
      description: "Comma-separated groupId prefixes whose -sources.jar is removed from the local repository before the language server imports the project (-Dcodiqo.jdtSourceExclusions). REPLACES the default list rather than adding to it. The default covers the Scala and Kotlin dependency families whose source jars hang or crash the import; extend it (repeating the defaults you still want) if a dependency of yours ships non-Java sources and the import stalls."
      default: ""
    max-requests:
      description: "Maximum concurrent HTTP requests the engine issues."
      default: ""
    max-requests-per-host:
      description: "Maximum concurrent HTTP requests per host."
      default: ""
    lsp-query-timeout-seconds:
      description: "Timeout for a single language-server query, such as a call-hierarchy lookup."
      default: ""
    agent-instructions:
      description: "Attach the repository's agent instruction files (AGENTS.md, CLAUDE.md, .github/copilot-instructions.md, .cursorrules, .cursor/rules, and equivalents) to the local review. They are a hint for finding triage only: they stop the model reporting your documented idioms as defects and shape suggested fixes, and are barred from changing any score. Set to false to keep them out of the review entirely."
      default: "true"
    agent-instruction-files:
      description: "Comma-separated extra instruction paths, relative to the repository root, on top of (or instead of) the well-known locations. An entry may name a file or a directory of rule files."
      default: ""
    agent-instructions-max-chars:
      description: "Ceiling on the assembled instruction text. Exceeding it fails the analysis rather than truncating, so the ceiling is raised deliberately: a trimmed rule set silently changes which findings the model suppresses. Leave empty for the engine default (64 KiB)."
      default: ""
    review:
      description: "Local mode (-Dcodiqo.review): an OpenCode review, with a CLI this action installs, reviews and assesses every analysed commit in that commit's own checkout, judges its PMD and SpotBugs findings after the build, and the server scores the commit from that assessment alone. A review that fails excludes the commit. It authenticates to the Codiqo LLM proxy with api-key and spends the organization's LLM budget; expect several minutes per reviewed commit. On by default and needed for scoring: the server has no prompt of its own, so with review: false every commit is excluded. Works under build-tool: maven and gradle."
      default: "true"
    review-timeout-minutes:
      description: "Limit for one review (-Dcodiqo.review.timeoutMinutes). Empty uses the plugin default of 150 minutes. The review runs inside per-commit-timeout, so with the review on that deadline is raised to at least this limit plus 30 minutes, with a warning. Only with review: true."
      default: ""
    review-temperature:
      description: "Sampling temperature of the review agents (-Dcodiqo.review.temperature), set on every model call. Empty uses the plugin default of 1.0, the review models' recommended value. Only with review: true."
      default: ""
    review-top-p:
      description: "Nucleus-sampling cut-off of the review agents (-Dcodiqo.review.topP). Empty uses the plugin default of 0.95. Only with review: true."
      default: ""
    opencode-version:
      description: "Version of the OpenCode CLI (npm package @opencode/cli) installed for the review. Needs npm on the runner. Only installed with review: true."
      default: "2.2.5"
    stop-on-first-failure:
      description: "Stop at the first commit that genuinely fails to analyse — a timeout, an out-of-memory kill, or a build failure of the analysis run itself. A commit codiqo excludes (unresolvable historical dependency, build failure of the analysed commit, no analyzable diff) is a normal outcome and never trips this. Turn it off to attempt every commit and fail the step at the end. A failure that halts the project in Codiqo stops the run either way."
      default: "true"
    require-full-history:
      description: "Fail early on a shallow or partially-cloned repository. Codiqo skips commits whose parent is missing locally, so without this a run can report success having analysed nothing."
      default: "true"
    heartbeat-interval-seconds:
      description: "How often to print a status line while a Maven step runs quietly into its log file. Keeps a long job visibly alive and records a memory and CPU trend."
      default: "30"
    maven-step-tail-lines:
      description: "How many log lines to echo when a step fails."
      default: "400"
    redact-env-names:
      description: "Newline or comma separated names of environment variables whose values must be scrubbed from the logs before upload. GitHub masks secrets in the live log only; artifact bytes are uploaded verbatim. Set those variables at job level so this action can see them."
      default: ""
    log-commit-authors:
      description: "Include commit author names and emails in the log. Off by default because the logs are uploaded as an artifact."
      default: "false"
---
codiqo-analyze:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  timeout: $[[ inputs.job-timeout ]]
  # one analysis at a time per project, as the action's concurrency group does: two would review
  # and submit the same pending commits
  resource_group: codiqo-analyze
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger|pipeline)$/
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # every commit, not the 20 GitLab fetches by default: a commit whose parent is missing is not analysed
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    CODIQO_ACTION_REF: $[[ inputs.action-ref ]]
    CODIQO_ACTION_ARCHIVE_URL: $[[ inputs.action-archive-url ]]
    CODIQO_IN_NODE_VERSION: $[[ inputs.node-version ]]
    CODIQO_IN_API_URL: $[[ inputs.api-url ]]
    CODIQO_IN_BRANCH: $[[ inputs.branch ]]
    CODIQO_IN_VERSION: $[[ inputs.codiqo-version ]]
    CODIQO_IN_JAVA_HOME: $[[ inputs.java-home ]]
    CODIQO_IN_JDTLS_JAVA_VERSION: $[[ inputs.jdtls-java-version ]]
    CODIQO_IN_JDTLS_JAVA_HOME: $[[ inputs.jdtls-java-home ]]
    CODIQO_IN_BUILD_TOOL: $[[ inputs.build-tool ]]
    CODIQO_IN_GRADLE_COMMAND: $[[ inputs.gradle-command ]]
    CODIQO_IN_GRADLE_TASKS: $[[ inputs.gradle-tasks ]]
    CODIQO_IN_GRADLE_PROJECT_PROPERTIES: $[[ inputs.gradle-project-properties ]]
    CODIQO_IN_GRADLE_ARGS: $[[ inputs.gradle-args ]]
    CODIQO_IN_ANALYSIS_MAX_HEAP: $[[ inputs.analysis-max-heap ]]
    CODIQO_IN_MAVEN_COMMAND: $[[ inputs.maven-command ]]
    CODIQO_IN_MAVEN_VERSION: $[[ inputs.maven-version ]]
    CODIQO_IN_MAVEN_HOME: $[[ inputs.maven-home ]]
    CODIQO_IN_JDTLS_VERSION: $[[ inputs.jdtls-version ]]
    CODIQO_IN_JDTLS_USE_SNAPSHOT: $[[ inputs.jdtls-use-snapshot ]]
    CODIQO_IN_COMMIT_WINDOW: $[[ inputs.commit-window ]]
    CODIQO_IN_EXCLUDE_AUTHOR_EMAILS: $[[ inputs.exclude-author-emails ]]
    CODIQO_IN_INCLUDE_AUTHOR_EMAILS: $[[ inputs.include-author-emails ]]
    CODIQO_IN_FIRST_PARENT_ONLY: $[[ inputs.first-parent-only ]]
    CODIQO_IN_MAX_COMMITS: $[[ inputs.max-commits-per-run ]]
    CODIQO_IN_INDEX_BATCH_SIZE: $[[ inputs.index-batch-size ]]
    CODIQO_IN_INDEX_REF: $[[ inputs.index-ref ]]
    CODIQO_IN_PER_COMMIT_TIMEOUT: $[[ inputs.per-commit-timeout ]]
    CODIQO_IN_BUILD_TIMEOUT_MINUTES: $[[ inputs.build-timeout-minutes ]]
    CODIQO_IN_TEST_TIMEOUT_MINUTES: $[[ inputs.test-timeout-minutes ]]
    CODIQO_IN_PER_TEST_TIMEOUT: $[[ inputs.per-test-timeout ]]
    CODIQO_IN_IMPORT_TIMEOUT_MINUTES: $[[ inputs.import-timeout-minutes ]]
    CODIQO_IN_API_CONNECT_TIMEOUT: $[[ inputs.api-connect-timeout-seconds ]]
    CODIQO_IN_API_READ_TIMEOUT: $[[ inputs.api-read-timeout-seconds ]]
    CODIQO_IN_MAVEN_USER_PROPERTIES: $[[ inputs.maven-user-properties ]]
    CODIQO_IN_MAVEN_ARGS: $[[ inputs.maven-args ]]
    CODIQO_IN_MAVEN_OPTS: $[[ inputs.maven-opts ]]
    CODIQO_IN_FORK_MAVEN_OPTS: $[[ inputs.fork-maven-opts ]]
    CODIQO_IN_MAVEN_PARALLELISM: $[[ inputs.maven-parallelism ]]
    CODIQO_IN_MANAGE_PLUGIN_REPOSITORY: $[[ inputs.manage-plugin-repository ]]
    CODIQO_IN_PLUGIN_REPOSITORY_URL: $[[ inputs.plugin-repository-url ]]
    CODIQO_IN_TIME_MACHINE_REPOSITORIES: $[[ inputs.time-machine-repositories ]]
    CODIQO_IN_RESOLVE_DEPENDENCIES: $[[ inputs.resolve-dependencies ]]
    CODIQO_IN_EXCLUDE_REVERTED_COMMITS: $[[ inputs.exclude-reverted-commits ]]
