    CODIQO_IN_STOP_ON_FIRST_FAILURE: $[[ inputs.stop-on-first-failure ]]
    CODIQO_IN_REQUIRE_FULL_HISTORY: $[[ inputs.require-full-history ]]
    CODIQO_IN_HEARTBEAT_INTERVAL: $[[ inputs.heartbeat-interval-seconds ]]
    CODIQO_IN_TAIL_LINES: $[[ inputs.maven-step-tail-lines ]]
    CODIQO_REDACT_ENV_NAMES: $[[ inputs.redact-env-names ]]
    CODIQO_IN_LOG_COMMIT_AUTHORS: $[[ inputs.log-commit-authors ]]
  cache:
    key: codiqo-analyze
    paths:
      - .codiqo/cache/
    when: always
  script:
    # a slim JDK image (eclipse-temurin:25-jdk) has no curl to fetch the scripts with; run.sh installs the rest
    - |
      if ! command -v curl > /dev/null 2>&1; then
        if command -v apt-get > /dev/null 2>&1; then
          apt-get update -qq > /dev/null && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null
        elif command -v apk > /dev/null 2>&1; then
          apk add --no-cache curl ca-certificates bash > /dev/null
        elif command -v microdnf > /dev/null 2>&1; then
          microdnf install -y curl > /dev/null
        elif command -v dnf > /dev/null 2>&1; then
          dnf install -y -q curl > /dev/null
        fi
      fi
    - mkdir -p .codiqo/action
    - >-
      curl -fsSL --retry 3 "${CODIQO_ACTION_ARCHIVE_URL:-https://codeload.github.com/codiqo/codiqo-action/tar.gz/${CODIQO_ACTION_REF}}"
      | tar -xz --strip-components=1 -C .codiqo/action
    - bash .codiqo/action/scripts/run.sh
  after_script:
    - if [ -f .codiqo/action/scripts/run.sh ]; then bash .codiqo/action/scripts/run.sh finish; fi
  artifacts:
    name: codiqo-analyze-logs
    when: always
    expire_in: $[[ inputs.log-retention-days ]] days
    paths:
      - .codiqo/logs/
