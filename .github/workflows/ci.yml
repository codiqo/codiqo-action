name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint is fetched as a pinned release binary rather than via a third-party action:
      # a public action should not push its own supply chain onto every consumer's audit.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

      - name: shellcheck
        run: shellcheck --severity=style scripts/*.sh

      - name: bash syntax
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: python syntax
        run: python3 -m py_compile scripts/*.py

      # gitlab/codiqo.yml is generated from action.yml, so the GitLab template takes exactly the action's inputs
      # with the action's defaults; one edited by hand, or an input added without regenerating, drifts silently.
      - name: the GitLab template is generated from action.yml
        run: |
          set -euo pipefail
          ruby gitlab/generate.rb > /tmp/codiqo.yml
          if ! diff -u gitlab/codiqo.yml /tmp/codiqo.yml; then
            echo "gitlab/codiqo.yml is stale: run ruby gitlab/generate.rb > gitlab/codiqo.yml"; exit 1
          fi
          ruby -ryaml -e 'docs = YAML.load_stream(File.read("gitlab/codiqo.yml")); docs.fetch(0).fetch("spec").fetch("inputs"); docs.fetch(1).fetch("codiqo-analyze")'
          # every variable a script reads must reach the GitLab job, as action.yml must set it for GitHub
          python3 - <<'PY'
          import re, pathlib, sys
          template = pathlib.Path("gitlab/codiqo.yml").read_text()
          set_here = set(re.findall(r"^\s+(CODIQO_[A-Z0-9_]+):", template, re.M))
          read = set()
          for p in pathlib.Path("scripts").glob("*.sh"):
              read |= set(re.findall(r"\$\{(CODIQO_IN_[A-Z0-9_]+)", p.read_text()))
          # secrets are CI/CD variables on GitLab; the rest are set by scripts/run.sh itself
          missing = read - set_here - {"CODIQO_IN_HAS_API_KEY", "CODIQO_IN_SETTINGS_XML", "CODIQO_IN_LOG_ARTIFACT_NAME"}
          if missing:
              print("scripts read env the GitLab template never sets:", sorted(missing)); sys.exit(1)
          print(f"ok: {len(read)} script env vars reach the GitLab job")
          PY

      # actionlint checks workflows only, never action.yml, and the step below reads action.yml as text: a quote
      # that ended a string early passed both and broke every caller. Ruby's stdlib YAML parser is on the runner.
      - name: action.yml is valid YAML
        run: ruby -ryaml -e 'YAML.safe_load(File.read("action.yml")).fetch("inputs")'

      - name: action.yml is internally consistent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, sys
          import xml.etree.ElementTree  # noqa: F401  (stdlib availability check for the merge script)
          body = pathlib.Path("action.yml").read_text()

          def declared_inputs(text):
              """Keys inside the top-level inputs: block only.

              A bare `^  (\\w+):` regex would also pick up outputs: keys and runs.steps, so walk
              from the inputs: line to the next column-zero key instead.
              """
              names, inside = [], False
              for line in text.splitlines():
                  if re.match(r"^[a-z]", line):
                      inside = line.startswith("inputs:")
                      continue
                  if inside:
                      hit = re.match(r"^  ([a-z0-9-]+):$", line)
                      if hit:
                          names.append(hit.group(1))
              return set(names)

          # every inputs.<name> reference must be a declared input, and vice versa
          declared = declared_inputs(body)
          used = set(re.findall(r"inputs\.([a-z0-9-]+)", body))
          problems = []
          if used - declared:
              problems.append(f"referenced but not declared: {sorted(used - declared)}")
          if declared - used:
              problems.append(f"declared but never used: {sorted(declared - used)}")
          # every CODIQO_IN_* the scripts read must be set somewhere in action.yml
          set_here = set(re.findall(r"^\s+(CODIQO_[A-Z0-9_]+):", body, re.M))
          read = set()
          # run.sh, setup-node.sh and setup-jdk.sh are the GitLab template's own steps, which action.yml never calls; the GitLab
          # template step checks the variables they read
          gitlab_only = {"run.sh", "setup-node.sh", "setup-jdk.sh"}
          for p in (f for f in pathlib.Path("scripts").iterdir() if f.is_file() and f.name not in gitlab_only):  # the python syntax step leaves __pycache__
              t = p.read_text()
              read |= set(re.findall(r"\$\{(CODIQO_IN_[A-Z0-9_]+)", t))
          if read - set_here:
              problems.append(f"scripts read env never set by action.yml: {sorted(read - set_here)}")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print(f"ok: {len(declared)} inputs, {len(read)} script env vars wired")
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Docs drift is the failure mode nobody notices: an input added without a README row is
      # invisible to users, so make it a build failure instead.
      - name: every input is documented in the README
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, sys
          action = pathlib.Path("action.yml").read_text()
          readme = pathlib.Path("README.md").read_text()
          # scoped to the inputs: block; outputs: and runs.steps keys are not inputs
          inputs, inside = [], False
          for line in action.splitlines():
              if re.match(r"^[a-z]", line):
                  inside = line.startswith("inputs:")
                  continue
              if inside:
                  hit = re.match(r"^  ([a-z0-9-]+):$", line)
                  if hit:
                      inputs.append(hit.group(1))
          missing = [name for name in inputs if f"`{name}`" not in readme]
          if missing:
              print("inputs missing from README:", missing); sys.exit(1)
          print(f"ok: all {len(inputs)} inputs documented")
          PY

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # resolve-config.sh refuses a shallow clone, which is what a bare checkout is
        with:
          fetch-depth: 0

      # The shorthand mappings are the action's compatibility contract: callers pass '3m' and
      # '1h' from dropdowns, and ISO-8601 parsing of '3m' would throw at the plugin.
      - name: shorthand mapping
        run: |
          set -euo pipefail
          RUNNER_TEMP="$(mktemp -d)"
          export GITHUB_ACTION_PATH="$PWD" RUNNER_TEMP
          # Captured into a variable rather than piped: `... | grep -q` makes grep exit on the
          # first match, the producer takes SIGPIPE, and under pipefail the pipeline reports 141
          # even though the assertion passed.
          probe() {
            CODIQO_IN_VERSION=1.0-SNAPSHOT CODIQO_IN_COMMIT_WINDOW="$1" \
            CODIQO_IN_PER_COMMIT_TIMEOUT="$2" CODIQO_IN_PER_TEST_TIMEOUT="$3" \
              ./scripts/resolve-config.sh 2>&1 || true
          }
          expect() {
            local out
            out="$(probe "$1" "$2" "$3")"
            case "$out" in
              *"$4"*) ;;
              *) echo "FAIL: window=$1 commit=$2 test=$3 did not yield '$4'"; echo "$out"; exit 1 ;;
            esac
          }
          expect 0      1h 15m 'commit window    : P0D'
          expect 1m     1h 15m 'commit window    : P1M'
          expect 3m     1h 15m 'commit window    : P3M'
          expect 6m     1h 15m 'commit window    : P6M'
          expect 1year  1h 15m 'commit window    : P1Y'
          expect P2W    1h 15m 'commit window    : P2W'
          expect 3m    30m 15m 'per-commit limit : 30m'
          expect 3m     2h 15m 'per-commit limit : 120m'
          expect 3m     45 15m 'per-commit limit : 45m'
          expect 3m     1h off 'per-test limit   : 0m'
          expect 3m     1h  5m 'per-test limit   : 5m'
          # with the review on, the deadline holds the plugin's default review limit and its follow-ups
          floor="$(CODIQO_IN_REVIEW=true probe 3m 1h 15m)"
          case "$floor" in
            *'per-commit limit : 180m'*) ;;
            *) echo "FAIL: a 1h deadline was not raised to hold a 150m review"; echo "$floor"; exit 1 ;;
          esac
          # left empty, the deadline follows the review without a warning, and is an hour without it
          auto="$(CODIQO_IN_REVIEW=true probe 3m '' 15m)"
          case "$auto" in
            *'::warning::per-commit-timeout'*) echo "FAIL: the default deadline warned about itself"; echo "$auto"; exit 1 ;;
            *'per-commit limit : 180m'*) ;;
            *) echo "FAIL: an empty deadline did not hold the 150m review"; echo "$auto"; exit 1 ;;
          esac
          auto="$(CODIQO_IN_REVIEW=true CODIQO_IN_REVIEW_TIMEOUT_MINUTES=60 probe 3m '' 15m)"
          case "$auto" in
            *'per-commit limit : 90m'*) ;;
            *) echo "FAIL: an empty deadline did not follow review-timeout-minutes"; echo "$auto"; exit 1 ;;
          esac
          expect 3m     '' 15m 'per-commit limit : 120m'
          # a secret that never reached the workflow stops the run before anything is installed
          nokey="$(CODIQO_IN_HAS_API_KEY=false probe 3m 1h 15m)"
          case "$nokey" in
            *'::error::api-key is empty'*) ;;
            *) echo "FAIL: an empty api-key was not rejected"; echo "$nokey"; exit 1 ;;
          esac
          # and invalid values must be rejected, not silently defaulted
          reject() {
            local out
            out="$(probe "$1" "$2" "$3")"
            case "$out" in
              *'::error::'*) ;;
              *) echo "FAIL: window=$1 commit=$2 test=$3 was accepted"; echo "$out"; exit 1 ;;
            esac
          }
          reject zzz 1h  15m
          reject 3m  3days 15m
          reject 3m  1h  -5
          echo "ok: shorthand mappings and rejections behave"

      # The nesting per-commit > build > test is what makes a fork timeout reportable instead of
      # fatal, so it is derived and clamped rather than merely documented.
      - name: timeout nesting is derived and clamped
        run: |
          set -euo pipefail
          RUNNER_TEMP="$(mktemp -d)"
          export GITHUB_ACTION_PATH="$PWD" RUNNER_TEMP
          fit() {
            CODIQO_IN_VERSION=1.0-SNAPSHOT CODIQO_IN_COMMIT_WINDOW=3m \
            CODIQO_IN_PER_COMMIT_TIMEOUT="$1" CODIQO_IN_PER_TEST_TIMEOUT=15m \
            CODIQO_IN_BUILD_TIMEOUT_MINUTES="$2" CODIQO_IN_TEST_TIMEOUT_MINUTES="$3" \
              ./scripts/resolve-config.sh 2>&1 || true
          }
          assert() {
            local out
            out="$(fit "$1" "$2" "$3")"
            case "$out" in
              *"$4"*) ;;
              *) echo "FAIL: commit=$1 build=$2 test=$3 did not yield '$4'"; echo "$out"; exit 1 ;;
            esac
          }
          # left empty, each budget is three quarters of the one around it
          assert 1h  '' '' 'build limit      : 45m'
          assert 1h  '' '' 'test limit       : 30m'
          assert 30m '' '' 'build limit      : 22m'
          # a build timeout that cannot fire inside the deadline is clamped, not rejected: the
          # documented per-commit-timeout: 30m shorthand must keep working
          assert 30m 60 '' 'build limit      : 22m'
          assert 30m 60 '' '::warning::'
          # and a test timeout that cannot fire inside the build is clamped the same way
          assert 1h  45 90 'test limit       : 33m'
          # values that already fit are passed through untouched
          assert 90m 50 20 'build limit      : 50m'
          assert 90m 50 20 'test limit       : 20m'
          # the per-test budget is the last rung, and `off` stays off at every size
          assert 30m '' '' 'per-test limit   : 8m'
          assert 1h  '' '' 'per-test limit   : 15m'
          # the action's own defaults (an empty deadline, a 90m build) never clamp each other
          for review in true false; do
            out="$(CODIQO_IN_REVIEW=$review fit '' 90 '')"
            case "$out" in
              *'::warning::build-timeout'* | *'::warning::per-commit'*) echo "FAIL: the defaults clamped each other (review: $review)"; echo "$out"; exit 1 ;;
              *'build limit      : 90m'*) ;;
              *) echo "FAIL: the default 90m build did not survive (review: $review)"; echo "$out"; exit 1 ;;
            esac
          done
          echo "ok: timeout budgets nest"

      # One commit's progress file holds a build per session (the Maven fork's compile run, then its
      # test run); the module count restarts with each, so the test run never reads "17/15".
      - name: module progress counts each build session from one
        run: |
          set -euo pipefail
          . scripts/lib.sh
          file="$(mktemp)"
          printf '1\tSESSION\t2\n2\tSUCCESS\tg:a\t1000\n3\tSUCCESS\tg:b\t2000\n' > "$file"
          first="$(codiqo::_emit_progress "$file"; echo "seen=$CODIQO_PROGRESS_SEEN")"
          printf '4\tSESSION\t2\n5\tSUCCESS\tg:a\t3000\n6\tSUCCESS\tg:b\t4000\n' >> "$file"
          CODIQO_PROGRESS_SEEN=3
          second="$(codiqo::_emit_progress "$file")"
          case "$first" in *'2/2 SUCCESS b'*'seen=3'*) ;; *) echo "FAIL: first build: $first"; exit 1 ;; esac
          case "$second" in *'1/2 SUCCESS a'*'2/2 SUCCESS b'*) ;; *) echo "FAIL: second build kept counting: $second"; exit 1 ;; esac
          echo "ok: each build session counts its modules from one"

      # An unsized heap is a quarter of the runner, which large projects outgrow; the default is half,
      # and a heap the caller or the job already set is never touched.
      - name: an unsized Maven heap gets the default cap
        run: |
          set -euo pipefail
          RUNNER_TEMP="$(mktemp -d)"
          export GITHUB_ACTION_PATH="$PWD" RUNNER_TEMP
          exported() {
            : > "$RUNNER_TEMP/env"
            env GITHUB_ENV="$RUNNER_TEMP/env" CODIQO_IN_VERSION=1.0-SNAPSHOT CODIQO_IN_MAVEN_VERSION=3.9.16 \
              CODIQO_IN_GRADLE_COMMAND=/usr/bin/true "$@" ./scripts/resolve-config.sh > /dev/null 2>&1 || true
            grep '^MAVEN_OPTS=' "$RUNNER_TEMP/env" || true
          }
          same() {
            [ "$1" = "$2" ] || { echo "FAIL: exported '$1', wanted '$2'"; exit 1; }
          }
          same "$(exported MAVEN_OPTS=)" 'MAVEN_OPTS=-XX:MaxRAMPercentage=50'
          same "$(exported MAVEN_OPTS=-Dfoo=bar)" 'MAVEN_OPTS=-Dfoo=bar -XX:MaxRAMPercentage=50'
          same "$(exported MAVEN_OPTS='-Xmx16g -Dfoo=bar')" ''
          same "$(exported MAVEN_OPTS= CODIQO_IN_MAVEN_OPTS=-Xmx4g)" 'MAVEN_OPTS=-Xmx4g'
          same "$(exported MAVEN_OPTS= CODIQO_IN_MAVEN_OPTS=-XX:MaxRAMPercentage=70)" 'MAVEN_OPTS=-XX:MaxRAMPercentage=70'
          # Gradle sizes its analysis JVM through analysis-max-heap, never MAVEN_OPTS
          same "$(exported MAVEN_OPTS= CODIQO_IN_BUILD_TOOL=gradle)" ''
          echo "ok: the default heap cap applies only where no heap is set"

      - name: settings.xml merge is idempotent and preserves the caller's profiles
        run: |
          set -euo pipefail
          # the assertions below query the merged file with xmllint, which ubuntu-latest does not ship
          command -v xmllint > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
          work="$(mktemp -d)"
          cat > "$work/settings.xml" <<'XML'
          <settings>
            <servers><server><id>mine</id><username>u</username></server></servers>
            <profiles><profile><id>mine</id></profile></profiles>
            <activeProfiles><activeProfile>mine</activeProfile></activeProfiles>
          </settings>
          XML
          url=https://central.sonatype.com/repository/maven-snapshots
          python3 scripts/inject-plugin-repository.py "$work/settings.xml" "$url"
          # Captured rather than piped into `grep -q`, for the reason given in the shorthand
          # mapping step above: the reader would exit first and fail the pipeline with 141.
          second="$(python3 scripts/inject-plugin-repository.py "$work/settings.xml" "$url")"
          case "$second" in
            *'already present'*) ;;
            *) echo "FAIL: second injection did not report 'already present'"; echo "$second"; exit 1 ;;
          esac
          xmllint --noout "$work/settings.xml"
          test "$(xmllint --xpath "count(//server[id='mine'])" "$work/settings.xml")" = 1
          test "$(xmllint --xpath "count(//profile[id='mine'])" "$work/settings.xml")" = 1
          test "$(xmllint --xpath "count(//pluginRepository[id='central-snapshots'])" "$work/settings.xml")" = 1
          # a malformed file must fail loudly rather than be silently rewritten
          printf '<settings><oops>\n' > "$work/bad.xml"
          if python3 scripts/inject-plugin-repository.py "$work/bad.xml" "$url"; then
            echo "FAIL: malformed settings.xml was accepted"; exit 1
          fi
          echo "ok: settings.xml merge behaves"
